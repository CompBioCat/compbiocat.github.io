# CompBioCat website — Quarto configuration.
#
# Content lives in data files and news/, never in layouts. See CLAUDE.md.
# The look is defined entirely in assets/scss/custom.scss.

project:
  type: website
  output-dir: _site
  # Only these become pages. content/ holds the brief and the kickoff prompt —
  # working documents, not site content. Files starting with _ (the generated
  # includes) are ignored by Quarto automatically.
  render:
    - "*.qmd"
    - "news/**/*.qmd"
    - "!news/_TEMPLATE.qmd"
  resources:
    - .nojekyll          # stops GitHub running Jekyll over the rendered output
    # Quarto discovers an <img src> but NOT the paths inside a srcset, so the
    # @2x retina files must be listed explicitly. Named per directory so that
    # assets/images/_originals/ is never published.
    - assets/images/people/**
    - assets/images/banner/**
    - assets/images/logos/**
    - assets/docs/**

website:
  title: "CompBioCat"
  site-url: https://compbiocat.github.io
  repo-url: https://github.com/compbiocat/compbiocat.github.io
  description: >
    Computational biochemistry and biocatalysis, from molecular mechanism to
    biocatalyst design. Research group of Marc Garcia-Borràs and Ferran Feixas
    at the Institute of Computational Chemistry and Catalysis (IQCC),
    Universitat de Girona.
  favicon: assets/images/logos/iqcc.png
  search: false        # seven pages; the search affordance is just another control

  # Sentence case throughout, as pinned. Order follows BRIEF.md section 6.
  navbar:
    title: "CompBioCat"
    logo: ""
    pinned: false
    collapse-below: lg
    left:
      - text: "News"
        href: news.qmd
      - text: "Research"
        href: research.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Team"
        href: team.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "Code and data"
        href: code-and-data.qmd
      - text: "Contact"
        href: contact.qmd

  page-footer:
    left: |
      CompBioCat — Computational Biochemistry and Biocatalysis<br>
      IQCC and Department of Chemistry, Universitat de Girona
    right: |
      [GitHub](https://github.com/compbiocat)

format:
  html:
    theme:
      - assets/scss/custom.scss
    include-in-header:
      - assets/html/fonts.html
    toc: false
    # Short month plus year, matching the news listings. The day is deliberately
    # not shown: it is used only to order items that share a month.
    date-format: "MMM YYYY"
    anchor-sections: false      # the hover ¶ marks add noise to a quiet page
    link-external-icon: false   # the brief bans ↗ on links
    link-external-newwindow: false
    smooth-scroll: false        # motion is essentially none
    email-obfuscation: references
    grid:
      sidebar-width: 0px
      body-width: 928px         # the container; prose sits narrower inside it
      margin-width: 0px
      gutter-width: 1.5rem
