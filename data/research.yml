# Research page content, for scripts/build_research.py.
#
# The five areas are parallel lines of work, NOT a sequence — so they carry no
# numbering, per the design direction. Reorder the list to reorder the page.
#
# Selected papers are named by DOI and resolved against the BibTeX in
# data/*.bib, so the citation on this page always matches the publications
# page.
#
# `note` must add something the TITLE DOES NOT ALREADY SAY. The brief asks for
# "a one-line plain-language note on what it established", but its own examples
# are paraphrases of the titles — rendering both made every entry read twice.
# So the note now carries the extra facts the brief gives: corresponding
# authorship, a prize, a collaboration. Leave it out where there is nothing to
# add. If the group wants genuine significance statements ("this showed that
# ..."), write them here and they will replace these.
#
# THE PAPER-TO-AREA MAPPING IS MY PROPOSAL, NOT THE GROUP'S. content/BRIEF.md
# lists the areas and the eight papers, but not which belongs to which. Move a
# DOI between areas to change it; the page rebuilds from this file.
#
# The brief had a fifth area, "Mechanism-guided drug design". The group removed
# it on 2 Sep 2026 and retitled the remaining four.

areas:
  - title: "Reactive intermediates in biocatalytic processes"
    body: >
      Characterising short-lived, highly reactive intermediates in enzyme active
      sites, and using that control to unlock transformations enzymes do not
      perform in nature. Carbene and nitrene transfer, radical relay chemistry
      in nonheme iron enzymes, and selective oxidations.
    selected:
      - doi: "10.1126/science.abj2830"
        note: "Corresponding author: Garcia-Borràs."
      - doi: "10.1038/s41929-023-00979-4"
        note: ""
      - doi: "10.1038/s44160-024-00507-7"
        note: ""

  - title: "Multiscale protocols in biocatalysis"
    body: >
      Integrating QM, QM/MM, molecular dynamics, enhanced sampling and
      electrostatic analysis into workflows that connect conformational dynamics
      with chemical reactivity. Method development as much as application:
      understanding where current protocols break down when applied to
      biochemical systems.
    selected:
      - doi: "10.1021/jacs.5c05134"
        note: "Both principal investigators, with the Chica group."
      - doi: "10.1038/s41557-024-01647-1"
        note: ""

  - title: "Biochemical mechanisms"
    body: >
      Reconstructing how biomolecular processes evolve in time, and how their
      environment reshapes them — protonation states, pH, ligand binding,
      crowding. Long-timescale processes such as millisecond allosteric
      activation.
    selected:
      - doi: "10.1021/jacs.1c12629"
        note: >
          Corresponding author: Feixas. Awarded the RSEQ–GEQC prize for the best
          publication in computational chemistry, 2022.
      - doi: "10.3389/fmolb.2022.922361"
        note: "Corresponding author: Feixas."

  - title: "Supramolecular processes"
    body: >
      Host–guest recognition, encapsulation and regioselective reactivity in
      adaptable cages, capsules and supramolecular masks, largely in
      collaboration with the Ribas group at IQCC.
    selected:
      - doi: "10.1021/jacs.0c07591"
        note: "Corresponding author: Feixas."
