# Team page content, for scripts/build_team.py.
#
# Every fact here comes from content/BRIEF.md. Nothing is inferred.
#
# `slug` selects the portrait: assets/images/people/<slug>.jpg, generated by
# scripts/build_images.py. A member with no matching file gets a correctly-sized
# placeholder box, never a stock photo.
#
# Order in each list is the order on the page. The PIs are shown as a pair with
# Marc first, which the brief pins.

group_photo:
  src: assets/images/banner/team.jpg
  alt: The CompBioCat group on the Montilivi campus, Universitat de Girona.

# ---------------------------------------------------------------------------
# Principal investigators
# ---------------------------------------------------------------------------
pis:
  - name: "Marc Garcia-Borràs"
    slug: marc-garcia-borras
    role: "ICREA Research Professor at IQCC, Universitat de Girona"
    bio: >
      PhD in Chemistry from the Universitat de Girona (2015), with Miquel Solà
      and Josep M. Luis. Postdoctoral researcher with K. N. Houk at UCLA
      (2016–2019). Returned to the UdG as a Beatriu de Pinós researcher, and
      subsequently a Ramón y Cajal Fellow at IQCC from 2022 to 2026.
    interests:
      - Reactive intermediates in biocatalysis
      - Computationally-guided enzyme design
      - Carbene and nitrene transferases
      - Nonheme iron enzymes
      - Abiological radical chemistry
    email: marc.garcia@udg.edu
    links:
      - label: ORCID
        url: https://orcid.org/0000-0001-9458-1114
      - label: Google Scholar
        url: https://scholar.google.com/citations?user=IKCfbg0AAAAJ&hl=es

  - name: "Ferran Feixas"
    slug: ferran-feixas
    role: "Associate Professor at IQCC, Universitat de Girona"
    bio: >
      PhD in Chemistry from the Universitat de Girona (2011), with Miquel Solà,
      Jordi Poater and Eduard Matito. Postdoctoral researcher with J. Andrew
      McCammon at UC San Diego (2012–2014). Returned to the UdG as a Marie
      Skłodowska-Curie Individual Fellow, and then a Ramón y Cajal Researcher
      from 2022 to 2026.
    interests:
      - Molecular dynamics and enhanced sampling
      - Protein allostery and conformational dynamics
      - Ligand binding pathways
      - Supramolecular host–guest dynamics
      - Mechanism-guided drug design
    email: ferran.feixas@udg.edu
    links:
      - label: ORCID
        url: https://orcid.org/0000-0001-5147-0000
      - label: Google Scholar
        url: https://scholar.google.com/citations?user=xuc_XiYAAAAJ&hl=en
      - label: Personal site
        url: https://ferranfeixas.github.io

